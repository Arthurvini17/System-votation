version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: votation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d votation"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/votation?schema=public
      - NEXTAUTH_SECRET=sua_chave_secreta_aqui
      - NEXTAUTH_URL=https://votation.nyz.com.br
      - JWT_SECRET=sua_chave_secreta_aqui
      - JWT_EXPIRES_IN=1d
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

